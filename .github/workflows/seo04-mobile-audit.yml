name: SEO04 Website mobile lab baseline (advisory)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/seo04-mobile-audit.mjs"
      - ".github/workflows/seo04-mobile-audit.yml"
      - "components/cms-hero-carousel.tsx"
      - "components/catalog-product-image.tsx"
      - "components/published-image-gallery.tsx"
      - "app/sitemap.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo04-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Public mobile/desktop Chromium lab baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install browser outside Website runtime
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Measure public Website
        run: node scripts/seo04-mobile-audit.mjs
        env:
          SEO04_BASE_URL: https://www.fbmn.vn
      - name: Save report and mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seo04-public-lab-baseline
          path: artifacts/seo04
          retention-days: 7
          if-no-files-found: warn
