name: DL12A CEO Flutter / gateway (build only)
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ceo/**"
      - "docs/web-dl12a-ceo-flutter.md"
      - "docs/web-dl12d-ceo-vercel.md"
      - "docs/web-dl12c-ceo-push.md"
      - ".github/workflows/dl12a-ceo.yml"
      - ".github/workflows/dl12d-ceo-deploy.yml"
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ceo/gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ceo/flutter
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9' # Last reviewed passing SDK; stable floated to 3.50.0 on 12 Nov.
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href=/ceo/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify the actual single-origin Vercel CEO bundle
        run: |
          set -euo pipefail
          mkdir -p ../gateway/public/ceo
          cp -a build/web/. ../gateway/public/ceo/
          cd ../gateway
          npm install --no-audit --no-fund
          FBMN_CEO_PREBUILT=1 bash scripts/vercel-build-ceo.sh
          test -s public/ceo/index.html
          test -s public/ceo/flutter_bootstrap.js
          test -s public/ceo/push_bridge.js
          test -s public/ceo/push-sw.js
          node -e "const s=require('fs').readFileSync('public/ceo/index.html','utf8');if(!s.includes('<base href=\"/ceo/\">'))process.exit(1)"
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dl12a-ceo-flutter-web
          path: apps/ceo/flutter/build/web
          retention-days: 7
