name: DL8 read-only Website cross-browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/dl8-browser-audit.mjs"
      - ".github/workflows/dl8-browser-audit.yml"
      - "tests/dl8-regression.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dl8-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    name: DL8 Chromium / WebKit public UAT lab (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install audit-only dependencies (not production)
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium and WebKit with system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Audit public Futurebook production without any POST
        run: node scripts/dl8-browser-audit.mjs
        env:
          DL8_BASE_URL: https://www.fbmn.vn
      - name: Preserve screenshots, WCAG and performance observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dl8-public-browser-regression
          path: artifacts/dl8
          retention-days: 7
          if-no-files-found: warn
