name: Deploy Public Worker staging by Owner comment (manual)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: fbmn-public-worker-staging-owner-release
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/deploy public worker staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - name: Checkout trusted release guard from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate Owner, merged PR, green main CI and clean Codex
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUESTED_BY: ${{ github.event.comment.user.login }}
          DEPLOY_COMMAND: ${{ github.event.comment.body }}
        run: |
          node --input-type=module -e '
            import {appendFileSync} from "node:fs";
            import {authorizeAdminProduction} from "./scripts/authorize-admin-production.mjs";
            const r=await authorizeAdminProduction(process.env,fetch,"/deploy public worker staging");
            appendFileSync(process.env.GITHUB_OUTPUT,"sha="+r.sha+"\npr_number="+r.pr_number+"\n");
          '
  deploy:
    name: Deploy existing Public Worker STAGING without replacing bindings
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: b6ea0f0aebc80950df1b4768c430c8df
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact approved main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned public Worker dependencies
        run: npm install --prefix backend/public-api --no-audit --no-fund --no-package-lock
      - name: Validate Worker source and current main
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          node --check backend/public-api/staging-worker.mjs
          node --check backend/public-api/handler.mjs
          node --check backend/public-api/read-model.mjs
          node --input-type=module -e '
            const r=await fetch("https://api.github.com/repos/"+process.env.GITHUB_REPOSITORY+"/git/ref/heads/main",{
              headers:{Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json"}});
            if(!r.ok||(await r.json()).object?.sha!==process.env.APPROVED_SHA)
              throw new Error("main changed; refuse stale Worker deploy");
          '
      - name: Deploy only the existing public Worker with verified live vars
        working-directory: backend/public-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          npx --no-install wrangler deploy --config wrangler.jsonc
      - name: Release evidence
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          echo "Public Worker: futurebook-mien-nam-public-api-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Production DB migration must be independently verified before this deployment." >> "$GITHUB_STEP_SUMMARY"
