name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and foundation smoke tests
        run: npm test
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  public-worker-build:
    name: Build isolated public API Worker (dry run only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated Worker dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend/public-api
      - name: Bundle Worker without deploying
        run: npx --no-install wrangler deploy --dry-run --outdir ../../.tmp-worker-bundle
        working-directory: backend/public-api


  admin-worker-build:
    name: Bundle Admin Worker (dry run only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Admin Worker dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend/admin-api
      - name: Bundle Admin Worker without deploying
        run: npm run build:check
        working-directory: backend/admin-api
      - name: Publish audited bundle handoff (reviewed main only; no deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend/admin-api
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find ../../.tmp-admin-worker-bundle -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print)
          test "${#modules[@]}" -eq 1
          file="${modules[0]}"
          bytes="$(wc -c < "$file")"
          test "$bytes" -gt 0 && test "$bytes" -lt 1000000
          sha256sum "$file"
          echo "FBMN_ADMIN_STAGING_BUILD_SHA=$GITHUB_SHA"
          echo "FBMN_ADMIN_STAGING_BUNDLE_BYTES=$bytes"
          echo "FBMN_ADMIN_STAGING_BUNDLE_START"
          base64 -w0 "$file" | fold -w 3500 | sed 's/^/FBMN_ADMIN_STAGING_B64:/'
          # base64 -w0 does not add a final newline; keep marker on a new line.
          echo
          echo "FBMN_ADMIN_STAGING_BUNDLE_END"

  admin-frontend-build:
    name: Build independent Admin frontend (dry run only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Admin frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/admin
      - name: Lint isolated Admin frontend
        run: npm run lint
        working-directory: apps/admin
      - name: Typecheck isolated Admin frontend
        run: npm run typecheck
        working-directory: apps/admin
      - name: Build Admin frontend without deploying
        run: npm run build
        working-directory: apps/admin
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Emit reviewed official Futurebook logo for manual Admin preview handoff
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          file="apps/admin/public/brand/fbmn-official-logo.webp"
          test -f "$file"
          test "$(wc -c < "$file")" -eq 3014
          sha256sum "$file"
          echo "FBMN_ADMIN_LOGO_SOURCE_SHA=$GITHUB_SHA"
          echo "FBMN_ADMIN_LOGO_B64_START"
          base64 -w0 "$file" | fold -w 3000 | sed 's/^/FBMN_ADMIN_LOGO_B64:/'
          echo
          echo "FBMN_ADMIN_LOGO_B64_END"
