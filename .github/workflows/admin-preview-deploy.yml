name: Deploy Admin preview by owner comment (manual)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: fbmn-admin-preview-deploy
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/deploy admin preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
      pr_number: ${{ steps.auth.outputs.pr_number }}
    steps:
      - name: Trusted authorizer on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Authorize exact PR head, green CI and Codex
        id: auth
        run: node scripts/authorize-admin-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUESTED_BY: ${{ github.event.comment.user.login }}
          DEPLOY_COMMAND: ${{ github.event.comment.body }}

  deploy:
    name: Deploy independent Admin frontend (preview only)
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_hUFtVIsg2fKzwGlfi2Lrw1du
      VERCEL_PROJECT_ID: prj_zfE2VTQuZJkEgOzOfJdokQsk5VZS
      VERCEL_CLI_VERSION: '63.1.2'
      NEXT_TELEMETRY_DISABLED: '1'
    # Vercel's Root Directory is apps/admin; invoke CLI from repository root.
    # Running CLI in apps/admin would apply the root twice.
    steps:
      - name: Checkout exact authorized PR SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate Vercel token
        run: test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN missing'; exit 1; }
      - name: Install pinned Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION}" --no-audit --no-fund
      - name: Link Admin project (not Website)
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull Admin PREVIEW environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build Admin PREVIEW only
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy Admin PREVIEW (no production alias)
        id: publish
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          DEPLOY_URL="$url" node --input-type=module -e 'const url=new URL(process.env.DEPLOY_URL);if(url.protocol!=="https:"||!url.hostname.endsWith(".vercel.app"))process.exit(1)'
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Record manual preview release
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          echo "Admin frontend: fbmn-admin" >> "$GITHUB_STEP_SUMMARY"
          echo "Only PREVIEW. No production deploy/alias." >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
