name: Deploy Admin Worker staging by Owner comment (manual)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: fbmn-admin-worker-staging-owner-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact reviewed main commit
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/deploy admin worker staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - name: Checkout trusted release guard from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate Owner, merged PR, exact green main CI and clean Codex
        id: gate
        run: node scripts/authorize-admin-worker-staging.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUESTED_BY: ${{ github.event.comment.user.login }}
          DEPLOY_COMMAND: ${{ github.event.comment.body }}

  deploy:
    name: Deploy only restricted Admin Worker STAGING
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: b6ea0f0aebc80950df1b4768c430c8df
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact approved main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Admin Worker dependencies without Cloudflare secrets
        run: npm install --prefix backend/admin-api --no-audit --no-fund --no-package-lock
      - name: Run staging Worker test and dry-run build without secrets
        run: npm run build:check --prefix backend/admin-api
      - name: Verify main has not advanced
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          node --input-type=module -e '
            const response=await fetch("https://api.github.com/repos/"+process.env.GITHUB_REPOSITORY+"/git/ref/heads/main",{
              headers:{Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json"}});
            if(!response.ok||(await response.json()).object?.sha!==process.env.APPROVED_SHA)
              throw new Error("main changed: refusing stale staging deployment");
          '
      - name: Deploy only the existing staging worker and preserve its configured bindings
        working-directory: backend/admin-api
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret'; exit 1; }
          npx --no-install wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish exact staging release evidence
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          RELEASE_PR: ${{ needs.authorize.outputs.pr_number }}
        run: |
          {
            echo "### Futurebook Admin Worker STAGING only"
            echo "Worker: futurebook-mien-nam-admin-api-staging"
            echo "Approved PR: #$RELEASE_PR"
            echo "Commit: $RELEASE_SHA"
            echo "No production Worker, public Worker, database migration, NET or data changes."
          } >> "$GITHUB_STEP_SUMMARY"
