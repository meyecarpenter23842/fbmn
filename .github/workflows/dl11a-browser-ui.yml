name: DL11A Website browser UI QA
on:
  pull_request:
    branches: [main]
    paths: ["app/policy/**","components/chatbot-widget.tsx","components/cms-popup-runtime.tsx","components/site-header.tsx","components/app-download.tsx","app/rebaseline.css","app/app-download.css","scripts/dl11a-browser-qa.mjs","scripts/dl11c-browser-qa.mjs","lib/analytics/**","app/api/analytics/**","app/api/catalogue-books/pdf/**","components/web-analytics.tsx","components/contact-request-form.tsx","components/outsourcing-request-form.tsx","components/catalogue-product-options.tsx","app/catalogue/catalogue-flipbook.tsx",".github/workflows/dl11a-browser-ui.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run start -- --port 3100 >/tmp/dl11a.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/dl11a-browser-qa.mjs
          node scripts/dl11c-browser-qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dl11a-browser
          path: artifacts/dl11a
          retention-days: 7
